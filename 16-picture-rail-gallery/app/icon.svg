<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#18181b"/>
  <!-- Brass rail -->
  <rect x="2" y="5" width="28" height="3" rx="1" fill="#eab308"/>
  <!-- Brass hook -->
  <path d="M16,4 L16,9" stroke="#ca8a04" stroke-width="2" stroke-linecap="round"/>
  <!-- Hanging wires -->
  <line x1="16" y1="9" x2="8" y2="15" stroke="#a1a1aa" stroke-width="1"/>
  <line x1="16" y1="9" x2="24" y2="15" stroke="#a1a1aa" stroke-width="1"/>
  <!-- Picture frame -->
  <rect x="7" y="15" width="18" height="13" rx="1.5" fill="#27272a" stroke="#d4d4d8" stroke-width="1.2"/>
  <rect x="10" y="18" width="12" height="7" rx="0.5" fill="#f59e0b" opacity="0.8"/>
</svg>
